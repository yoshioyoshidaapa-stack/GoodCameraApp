name: MCPサーバーを公開（Cloudflare Workers）

# GitHubの「Actions」画面から手動で実行する
# 事前に リポジトリの Settings → Secrets and variables → Actions に
# CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を登録しておくこと
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: テスト
        run: npm test

      - name: 型チェック
        run: npm run typecheck

      - name: Cloudflareに公開
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
