<text x="540" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#123">ESP32 基板</text>
<text x="540" y="154" font-size="12" text-anchor="middle" fill="#444">(ideaspark 液晶つき)</text>
<text x="352" y="124" font-size="11" fill="#7a3fb0" text-anchor="start">USB-C ← 口①</text>
<circle cx="430" cy="170" r="7" fill="#1aa83c" stroke="#000"/>
<text x="444" y="175" font-size="14" fill="#111" text-anchor="start" font-weight="bold">D21 (SDA)</text>
