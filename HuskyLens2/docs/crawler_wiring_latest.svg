<circle cx="650" cy="370" r="7" fill="#222" stroke="#000"/>
<text x="636" y="375" font-size="14" fill="#111" text-anchor="end" font-weight="bold">GND</text>
<rect x="430" y="486" width="220" height="150" rx="10" fill="#eaf7ea" stroke="#363" stroke-width="2"/>
<text x="540" y="512" font-size="17" font-weight="bold" text-anchor="middle" fill="#131">HuskyLens2 電源ボード</text>
<text x="540" y="530" font-size="12" text-anchor="middle" fill="#444">PWR IN の USB-C に給電(口③)</text>
<text x="440" y="544" font-size="12" fill="#111" text-anchor="start">黒 GND</text>
<text x="440" y="569" font-size="12" fill="#111" text-anchor="start">青 SCL</text>
<text x="440" y="594" font-size="12" fill="#111" text-anchor="start">緑 SDA</text>
<text x="440" y="616" font-size="11" fill="#7a3fb0" text-anchor="start">USB-C ← 口③</text>
<text x="540" y="654" font-size="11" fill="#252" text-anchor="middle">赤線はつなぐ必要なし(前の図と同じ)</text>
<rect x="30" y="530" width="200" height="110" rx="10" fill="#f3e9ff" stroke="#639" stroke-width="2"/>
<text x="130" y="556" font-size="17" font-weight="bold" text-anchor="middle" fill="#306">USB 端子台</text>
<text x="130" y="574" font-size="12" text-anchor="middle" fill="#444">口②の USB から取り出す</text>
<text x="160" y="632" font-size="13" fill="#d11" text-anchor="end" font-weight="bold">+5V</text>
<text x="100" y="632" font-size="13" fill="#111" text-anchor="end" font-weight="bold">GND</text>
<text x="140" y="606" font-size="12" fill="#7a3fb0" text-anchor="middle">口② USB ← </text>
<rect x="800" y="110" width="260" height="130" rx="10" fill="#fff0f0" stroke="#a33" stroke-width="2"/>
<text x="930" y="136" font-size="17" font-weight="bold" text-anchor="middle" fill="#511">左サーボ (SG90-HV)</text>
<text x="812" y="155" font-size="13" fill="#a50" text-anchor="start">橙 信号 ← GPIO25</text>
<text x="812" y="175" font-size="13" fill="#d11" text-anchor="start">赤 (+) → +5V</text>
<text x="812" y="195" font-size="13" fill="#111" text-anchor="start">茶 (−) → GND</text>
<rect x="800" y="270" width="260" height="130" rx="10" fill="#fff0f0" stroke="#a33" stroke-width="2"/>
<text x="930" y="296" font-size="17" font-weight="bold" text-anchor="middle" fill="#511">右サーボ (SG90-HV)</text>
<text x="812" y="315" font-size="13" fill="#a50" text-anchor="start">橙 信号 ← GPIO26</text>
<text x="812" y="335" font-size="13" fill="#d11" text-anchor="start">赤 (+) → +5V</text>
<text x="812" y="355" font-size="13" fill="#111" text-anchor="start">茶 (−) → GND</text>
<rect x="820" y="450" width="250" height="170" rx="10" fill="#fffbe0" stroke="#a80" stroke-width="2"/>
<text x="945" y="476" font-size="17" font-weight="bold" text-anchor="middle" fill="#540">前方の距離センサー</text>
<text x="945" y="588" font-size="12" fill="#540" text-anchor="middle">HC-SR04 など。車体の前に1個</text>
<text x="832" y="505" font-size="13" fill="#111" text-anchor="start">TRIG ← GPIO27</text>
<text x="832" y="555" font-size="13" fill="#111" text-anchor="start">ECHO → 分圧 → GPIO33</text>
<text x="940" y="612" font-size="12" fill="#d11" text-anchor="end">VCC</text>
<text x="1030" y="612" font-size="12" fill="#111" text-anchor="end">GND</text>
<rect x="760" y="543" width="40" height="14" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="0" y="0" font-size="12" fill="#111" text-anchor="middle"></text>
<text x="780" y="538" font-size="12" fill="#111" text-anchor="middle">1kΩ</text>
<rect x="733" y="580" width="14" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="722" y="604" font-size="12" fill="#111" text-anchor="end">2kΩ</text>
<text x="752" y="574" font-size="11" fill="#573" text-anchor="start">分圧点</text>
<text x="880" y="752" font-size="12" fill="#a00" text-anchor="middle">↑ コンデンサ 470〜1000µF（+と−の向きに注意。+側を赤い線に）</text>
<text x="170" y="690" font-size="13" fill="#d11" text-anchor="start" font-weight="bold">+5V（赤）</text>
<text x="110" y="755" font-size="13" fill="#111" text-anchor="start" font-weight="bold">GND（黒）</text>
<text x="600" y="36" font-size="26" fill="#123" text-anchor="middle" font-weight="bold">クローラー 最新版 配線図</text>
<text x="600" y="60" font-size="13" fill="#a00" text-anchor="middle">設計図です。実機では未確認。つなぐときは、必ずバッテリーを外した状態で。線の色は、図の中でだけ意味があります。</text>
<text x="30" y="790" font-size="14" fill="#111" text-anchor="start" font-weight="bold">線の見方：</text>
<path d="M120 785 L148 785" fill="none" stroke="#7a3fb0" stroke-width="5" stroke-linejoin="round"/>
<text x="154" y="790" font-size="13" fill="#111" text-anchor="start">USBケーブル</text>
<path d="M250 785 L278 785" fill="none" stroke="#d11" stroke-width="5" stroke-linejoin="round"/>
<text x="284" y="790" font-size="13" fill="#111" text-anchor="start">+5V（赤）</text>
<path d="M370 785 L398 785" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
<text x="404" y="790" font-size="13" fill="#111" text-anchor="start">GND（黒）</text>
<path d="M490 785 L518 785" fill="none" stroke="#f08000" stroke-width="5" stroke-linejoin="round"/>
<text x="524" y="790" font-size="13" fill="#111" text-anchor="start">サーボの信号</text>
<path d="M625 785 L653 785" fill="none" stroke="#7a9a20" stroke-width="5" stroke-linejoin="round"/>
<text x="659" y="790" font-size="13" fill="#111" text-anchor="start">距離センサーの信号</text>
<path d="M830 785 L858 785" fill="none" stroke="#1aa83c" stroke-width="5" stroke-linejoin="round"/>
<text x="864" y="790" font-size="13" fill="#111" text-anchor="start">I2C SDA</text>
<path d="M950 785 L978 785" fill="none" stroke="#1e5fe0" stroke-width="5" stroke-linejoin="round"/>
<text x="984" y="790" font-size="13" fill="#111" text-anchor="start">I2C SCL</text>
<text x="30" y="825" font-size="13" fill="#111" text-anchor="start">・線が交差していて、片方が途切れている所は「つながっていない」です。丸い点があるところだけが、つながっています。</text>
<text x="30" y="848" font-size="13" fill="#a00" text-anchor="start">・ECHO は 5V を出します。ESP32 には 3.3V までなので、必ず 1kΩ と 2kΩ の抵抗で下げてから GPIO33 へ（3.3V 対応のセンサーなら不要）。</text>
<text x="30" y="871" font-size="13" fill="#111" text-anchor="start">・サーボの電気（口②）と、基板・HuskyLens2 の電気（口①③）は、別の USB 口から取る。ESP32 の GND と端子台の GND は、必ずつなぐ。</text></svg>