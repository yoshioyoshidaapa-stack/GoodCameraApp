<text x="444" y="225" font-size="14" fill="#111" text-anchor="start" font-weight="bold">D22 (SCL)</text>
<circle cx="430" cy="270" r="7" fill="#222" stroke="#000"/>
<text x="444" y="275" font-size="14" fill="#111" text-anchor="start" font-weight="bold">GND</text>
<circle cx="650" cy="170" r="7" fill="#f08000" stroke="#000"/>
<text x="636" y="175" font-size="14" fill="#111" text-anchor="end" font-weight="bold">GPIO25</text>
<circle cx="650" cy="220" r="7" fill="#f08000" stroke="#000"/>
<text x="636" y="225" font-size="14" fill="#111" text-anchor="end" font-weight="bold">GPIO26</text>
